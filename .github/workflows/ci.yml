name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - '1.26.x'
          - 'stable'
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Check formatting
        if: ${{ matrix.go-version == '1.26.x' }}
        shell: bash
        run: |
          unformatted="$(gofmt -l src)"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        if: ${{ matrix.go-version == '1.26.x' }}
        run: go vet ./...
      - name: Test normal and filesystem packages
        shell: bash
        run: |
          set -euo pipefail
          workspace_pkg='github.com/sori883/ai-dd/src/internal/workspace'
          okf_pkg='github.com/sori883/ai-dd/src/internal/okf'
          all_packages="$(go list ./...)"
          [[ -n "$all_packages" ]] || { echo 'package一覧が空です'; exit 1; }
          normal_packages=()
          workspace_count=0
          okf_count=0
          while IFS= read -r package; do
            case "$package" in
              "$workspace_pkg") workspace_count=$((workspace_count + 1)) ;;
              "$okf_pkg") okf_count=$((okf_count + 1)) ;;
              '') echo '空のpackage名です'; exit 1 ;;
              *) normal_packages+=("$package") ;;
            esac
          done <<< "$all_packages"
          [[ "$workspace_count" -eq 1 && "$okf_count" -eq 1 && ${#normal_packages[@]} -gt 0 ]] || {
            echo '通常packageとfilesystem対象の分割が成立しません'; exit 1;
          }
          printf 'normal packages: %s; filesystem packages: 2\n' "${#normal_packages[@]}"
          go test -count=1 -shuffle=on -coverprofile=coverage-normal.out "${normal_packages[@]}"
          go test -tags=integration -count=1 -shuffle=on -coverprofile=coverage-filesystem.out \
            "$workspace_pkg" "$okf_pkg"
      - name: Test with race detector
        if: ${{ matrix.go-version == '1.26.x' }}
        run: go test -count=1 -race -shuffle=on ./...
      - name: Test representative distribution journeys
        if: ${{ matrix.go-version == '1.26.x' }}
        run: go test -tags=integration -count=1 ./src/cmd/aidlc -run '^Test(FlowJourney|GitIndependentJourney)$'

      - name: Check module metadata
        if: ${{ matrix.go-version == '1.26.x' }}
        run: go mod tidy -diff
      - name: Smoke test native binary
        if: ${{ matrix.go-version == '1.26.x' }}
        shell: bash
        run: |
          set -euo pipefail

          binary="${RUNNER_TEMP}/aidlc"
          go build -trimpath -o "$binary" ./src/cmd/aidlc

          help_stdout="${RUNNER_TEMP}/help.stdout"
          help_stderr="${RUNNER_TEMP}/help.stderr"
          "$binary" --help >"$help_stdout" 2>"$help_stderr"
          grep -Fqx 'Usage:' "$help_stdout"
          if [[ -s "$help_stderr" ]]; then
            printf '%s\n' 'expected --help stderr to be empty'
            exit 1
          fi

          default_version_stdout="${RUNNER_TEMP}/default-version.stdout"
          default_version_stderr="${RUNNER_TEMP}/default-version.stderr"
          "$binary" --version >"$default_version_stdout" 2>"$default_version_stderr"
          if [[ "$(<"$default_version_stdout")" != 'aidlc dev (commit unknown)' ]]; then
            printf '%s\n' 'unexpected default version output'
            exit 1
          fi
          if [[ -s "$default_version_stderr" ]]; then
            printf '%s\n' 'expected default --version stderr to be empty'
            exit 1
          fi

          unknown_stdout="${RUNNER_TEMP}/unknown.stdout"
          unknown_stderr="${RUNNER_TEMP}/unknown.stderr"
          if "$binary" unknown >"$unknown_stdout" 2>"$unknown_stderr"; then
            printf '%s\n' 'expected unknown argument to fail'
            exit 1
          else
            unknown_status=$?
          fi
          if [[ "$unknown_status" -ne 2 ]]; then
            printf 'unknown argument exit code = %s, want 2\n' "$unknown_status"
            exit 1
          fi
          if [[ -s "$unknown_stdout" ]]; then
            printf '%s\n' 'expected unknown argument stdout to be empty'
            exit 1
          fi
          grep -Fqx 'aidlc: unknown arguments: "unknown"' "$unknown_stderr"
          grep -Fqx 'Usage:' "$unknown_stderr"
