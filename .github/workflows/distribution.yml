name: Distribution

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: Package (six targets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.26.x
          cache: false
      - name: Build and package candidates
        shell: bash
        run: |
          set -euo pipefail
          input="${RUNNER_TEMP}/dist-input"
          output="${RUNNER_TEMP}/dist-candidate"
          natural_output="${RUNNER_TEMP}/natural-dist-candidate"
          mkdir "$input"
          commit="$(git rev-parse HEAD)"
          version="dev-${commit:0:12}"
          toolchain="$(go env GOVERSION)"
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              extension=""
              if [[ "$os" == windows ]]; then extension=".exe"; fi
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags "-X github.com/sori883/ai-dd/src/internal/buildinfo.Version=$version -X github.com/sori883/ai-dd/src/internal/buildinfo.Commit=$commit" \
                -o "$input/aidlc-$os-$arch$extension" ./src/cmd/aidlc
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags "-X main.version=$version" \
                -o "$input/natural-japanese-go-$os-$arch$extension" ./src/cmd/natural-japanese-go
            done
          done
          go run ./src/cmd/aidlc-dist --input-dir "$input" --output-dir "$output" \
            --version "$version" --commit "$commit" --go-version "$toolchain"
          AIDLC_DIST_DIR="$output" go test -tags=integration -count=1 -v \
            ./src/cmd/aidlc-dist -run '^TestDistributionArchives$'
          go run ./src/cmd/aidlc-dist --product natural-japanese-go --input-dir "$input" --output-dir "$natural_output" \
            --version "$version" --commit "$commit" --go-version "$toolchain"
          AIDLC_NATURAL_DIST_DIR="$natural_output" go test -tags=integration -count=1 -v \
            ./src/cmd/aidlc-dist -run '^TestNaturalJapaneseDistributionArchives$'

  native:
    name: Native distribution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.26.x
          cache: false
      - name: Test native archive and manual update procedure
        run: go test -tags=integration -count=1 -v ./src/cmd/aidlc-dist -run '^Test(DistributionJourney|NaturalJapaneseDistributionJourney)$'
